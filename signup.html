<!DOCTYPE html>
<head>
    <title>signup</title>
    <style>
        .bg{
            background-color: lavenderblush;
        }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>signup</legend>
            <div class="bg">
            Email:<input type="email" placeholder="Enter your email"><br>
            UserName:<input type="text" placeholder="Enter your username"><br>
            Password:<input type="password" placeholder="Enter your password"><br>
            Confirm Password:<input type="password" placeholder="Re-enter your password"><br>
            <input type="submit" value="Submit"><br>
            </div>
        </fieldset>
    </form>
</body>
